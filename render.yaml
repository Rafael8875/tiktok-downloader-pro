services:
  - type: web
    name: tiktok-downloader-pro
    runtime: python
    plan: free
    buildCommand: "./render-build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: FLASK_DEBUG
        value: "false"
      - key: PORT
        value: "10000"
      - key: SECRET_KEY
        generateValue: true
      - key: FILE_EXPIRATION
        value: "900"
